<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Flag</title>
    <style>
        body {
            margin: 100PX;
            height: 50vh;
            content: center;
            background: #f0f0f0;
        }

        .flag {
            width: 300px;
            height: 200px;
            background: white;
            position: relative;
            border: 3px solid #004837;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        }

        .flag .circle {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #f42a41;
            top: 49%;
            left: 49%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <div class="flag" aria-label="Flag of Japan">
        <div class="circle"></div>
    </div>
</body>
</html>
