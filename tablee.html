<!DOCTYPE html>
<html>

<head>
    <title>Student Table</title>
    <link rel="stylesheet" href="color2.css">
    <style>
        table {
            border-collapse: collapse;
            width: 60%;
            margin: 20px auto;
        }

        th,
        td {
            border: 1px solid rgb(0, 0, 0);
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h2 style="text-align:center;">Student Information</h2>

    <table>
        <tr id="red">
            <td>Subjects</td>
            <td>Marks</td>
        </tr>

        <tr>
            <td>math</td>
            <td>90</td>
        </tr>

        <tr>
            <td>english</td>
            <td>85</td>
        </tr>

        <tr>
            <td>science</td>
            <td>95</td>
        </tr>

        <tr id="yellow">
            <td>total</td>
            <td>270</td>
        </tr>

</body>

</html>
